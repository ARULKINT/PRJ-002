<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Two-Passage Placeholder Swapper</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Two-Passage Placeholder Swapper</h1>

  <div class="panels">
    <section class="panel" id="panel1" data-panel="1">
      <h2>Passage 1</h2>
      <div class="toolbar">
        <button class="copy-btn">COPY</button>
        <span class="status" aria-live="polite"></span>
      </div>

      <div class="template-bar">
        <select class="template-select">
          <option value="" selected>Load a saved template…</option>
        </select>
        <button class="template-delete-btn" type="button" title="Delete selected template" disabled>✕</button>
        <button class="template-save-btn" type="button">Save as Template</button>
      </div>

      <div class="cycle-control">
        <button class="prev-btn" aria-label="Previous replacement" disabled>◀</button>
        <span class="current-word">No options yet</span>
        <button class="next-btn" aria-label="Next replacement" disabled>▶</button>
      </div>

      <textarea class="passage-box" placeholder="Paste (Ctrl+V) any passage here."></textarea>

      <label class="marker-label">Word to replace — picked from your passage, applies everywhere it appears until you change the passage</label>
      <select class="marker-select">
        <option value="" disabled selected>Paste a passage first…</option>
      </select>

      <label class="seed-label">Replacement options — paste one per line (Excel column, CSV) or comma-separated. Click a line to use it.</label>
      <textarea class="seed-box" placeholder="Alex&#10;Jordan&#10;Sam"></textarea>
    </section>

    <section class="panel" id="panel2" data-panel="2">
      <h2>Passage 2</h2>
      <div class="toolbar">
        <button class="copy-btn">COPY</button>
        <span class="status" aria-live="polite"></span>
      </div>

      <div class="template-bar">
        <select class="template-select">
          <option value="" selected>Load a saved template…</option>
        </select>
        <button class="template-delete-btn" type="button" title="Delete selected template" disabled>✕</button>
        <button class="template-save-btn" type="button">Save as Template</button>
      </div>

      <div class="cycle-control">
        <button class="prev-btn" aria-label="Previous replacement" disabled>◀</button>
        <span class="current-word">No options yet</span>
        <button class="next-btn" aria-label="Next replacement" disabled>▶</button>
      </div>

      <textarea class="passage-box" placeholder="Paste (Ctrl+V) any passage here."></textarea>

      <label class="marker-label">Word to replace — picked from your passage, applies everywhere it appears until you change the passage</label>
      <select class="marker-select">
        <option value="" disabled selected>Paste a passage first…</option>
      </select>

      <label class="seed-label">Replacement options — paste one per line (Excel column, CSV) or comma-separated. Click a line to use it.</label>
      <textarea class="seed-box" placeholder="Alex&#10;Jordan&#10;Sam"></textarea>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
